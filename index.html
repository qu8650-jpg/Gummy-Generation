<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUMMY GENERATION - Textures Restored</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        font-family: sans-serif;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">HAPPY GUMMY LOADING...</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import * as CANNON from "cannon-es";

      let scene, camera, renderer, world, composer;
      let gummies = [];
      let clouds = [];
      let lastTime = performance.now();

      const modelList = [
        "Airfare.glb",
        "Album.glb",
        "Beauty.glb",
        "Beyblade.glb",
        "Bottle.glb",
        "Camera.glb",
        "Champagne.glb",
        "Charm_1.glb",
        "Charm_2.glb",
        "Cloth_Dress.glb",
        "Cloth_Jeans.glb",
        "GamePoint.glb",
        "Gift.glb",
        "Kobo.glb",
        "LightStick.glb",
        "Manga.glb",
        "Material.glb",
        "Model_1.glb",
        "Model_2.glb",
        "Model_3.glb",
        "Model_4.glb",
        "Mouse.glb",
        "Perfume.glb",
        "PhoneCase.glb",
        "Tarot.glb",
      ];

      const cameraZ = 20;

      init();

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        world = new CANNON.World();
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(
          35,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = cameraZ;

        // 背景漸層球 (不變)
        const sphereGeo = new THREE.SphereGeometry(100, 32, 32);
        const sphereMat = new THREE.ShaderMaterial({
          side: THREE.BackSide,
          uniforms: {
            topColor: { value: new THREE.Color(0xb3e5fc) },
            bottomColor: { value: new THREE.Color(0xfce4ec) },
            offset: { value: 33 },
            exponent: { value: 0.6 },
          },
          vertexShader: `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4( position, 1.0 ); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
          fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main() { float h = normalize( vWorldPosition + offset ).y; gl_FragColor = vec4( mix( bottomColor, topColor, max( pow( max( h, 0.0 ), exponent ), 0.0 ) ), 1.0 ); }`,
        });
        scene.add(new THREE.Mesh(sphereGeo, sphereMat));

        createBetterClouds(); // 💡 完美、不變灰、不消失的純白雲朵

        // 💡 💡 關鍵修正 1：調低燈光強度，找回質感 💡 💡
        scene.add(new THREE.AmbientLight(0xffffff, 1.5)); // 💡 從 2.0 降至 1.5
        const p1 = new THREE.DirectionalLight(0xffffff, 1.0); // 💡 從 1.5 降至 1.0
        p1.position.set(10, 20, 10);
        scene.add(p1);

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          0.5,
          0.4,
          0.98,
        );
        bloomPass.threshold = 0.98;
        bloomPass.strength = 0.6;
        bloomPass.radius = 0.4;
        composer.addPass(bloomPass);

        const bokehPass = new BokehPass(scene, camera, {
          focus: 7.0,
          aperture: 0.0001,
          maxblur: 0.008,
          width: window.innerWidth,
          height: window.innerHeight,
        });
        composer.addPass(bokehPass);

        const manager = new THREE.LoadingManager();
        manager.onLoad = () => {
          document.getElementById("loading-overlay").style.display = "none";
          animate();
        };

        const loader = new GLTFLoader(manager);
        modelList.forEach((name) => {
          loader.load(name, (gltf) => {
            const master = gltf.scene;
            master.traverse((child) => {
              if (child.isMesh) {
                child.material.transparent = true;
                child.material.opacity = 0.75;
                // 💡 💡 關鍵修正 2：材質降溫處理，找回細節 💡 💡
                child.material.color.multiplyScalar(1.3); // 💡 從 2.0 降至 1.8
                child.material.roughness = 0.1;
                child.material.metalness = 0.1;
                child.material.emissive = child.material.color;
                child.material.emissiveIntensity = 0.05; // 💡 從 0.15 降至 0.05，大幅減少發光感
                child.material.side = THREE.DoubleSide;
              }
            });

            for (let i = 0; i < 4; i++) {
              const mesh = master.clone();
              const s = 45 + Math.random() * 20;
              mesh.scale.set(s, s, s);
              const zPos = (Math.random() - 0.5) * 24;
              const body = new CANNON.Body({
                mass: 1,
                shape: new CANNON.Sphere(s * 0.22),
                linearDamping: 0.9,
                angularDamping: 0.9,
              });
              resetMesh(mesh, body, zPos, true);
              scene.add(mesh);
              world.addBody(body);

              gummies.push({
                mesh,
                body,
                fallSpeed: 0.005 + Math.random() * 0.01,
                rotSpeed: {
                  x: (Math.random() - 0.5) * 0.006,
                  y: (Math.random() - 0.5) * 0.01,
                  z: (Math.random() - 0.5) * 0.005,
                },
              });
            }
          });
        });
      }

      function createBetterClouds() {
        // (雲朵生成邏輯保持純白積雲，不再贅述)
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        const centerWhite = "rgba(255, 255, 255, 1.0)";
        const shadowColor = "rgba(235, 240, 255, 0.6)";
        ctx.beginPath();
        ctx.arc(256, 256, 128, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(220, 220, 0, 256, 256, 128);
        gradient.addColorStop(0, centerWhite);
        gradient.addColorStop(0.7, shadowColor);
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.fill();
        const cloudTexture = new THREE.CanvasTexture(canvas);

        for (let i = 0; i < 40; i++) {
          const mat = new THREE.MeshBasicMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.3 + Math.random() * 0.3,
            depthWrite: false,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(28, 16), mat);
          mesh.position.set(
            (Math.random() - 0.5) * 120,
            (Math.random() - 0.5) * 75,
            -45 + Math.random() * 20,
          );
          scene.add(mesh);
          clouds.push({ mesh, driftSpeed: 0.002 + Math.random() * 0.006 });
        }
      }

      function resetMesh(mesh, body, zCoord, isFirstSpawn = false) {
        const distanceToCamera = Math.abs(zCoord - cameraZ);
        const planeHeightAtZ =
          2 * distanceToCamera * Math.tan((35 / 2) * (Math.PI / 180));
        const boundaryY = planeHeightAtZ / 2 + 10;
        const startX =
          (Math.random() - 0.5) *
          (planeHeightAtZ * (window.innerWidth / window.innerHeight) * 1.5);
        let finalY = isFirstSpawn
          ? (Math.random() - 0.5) * (boundaryY * 3.5)
          : boundaryY;
        mesh.position.set(startX, finalY, zCoord);
        body.position.set(startX, finalY, zCoord);
        mesh.killYAtZ = -boundaryY;
      }

      function animate(time) {
        requestAnimationFrame(animate);
        const deltaTime = (time - lastTime) / 1000;
        lastTime = time;
        world.step(1 / 60, deltaTime, 3);

        gummies.forEach((obj) => {
          obj.mesh.rotation.x += obj.rotSpeed.x;
          obj.mesh.rotation.y += obj.rotSpeed.y;
          obj.mesh.rotation.z += obj.rotSpeed.z;
          obj.body.position.y -= obj.fallSpeed;

          // 💡 💡 優雅的緩慢對流感 (Lerp 優化) 💡 💡
          obj.mesh.position.lerp(
            new THREE.Vector3(
              obj.body.position.x,
              obj.body.position.y,
              obj.body.position.z,
            ),
            0.05,
          );

          if (obj.mesh.position.y < obj.mesh.killYAtZ)
            resetMesh(obj.mesh, obj.body, obj.mesh.position.z);
        });

        clouds.forEach((c) => {
          c.mesh.position.x += c.driftSpeed;
          if (c.mesh.position.x > 80) c.mesh.position.x = -80;
        });
        composer.render();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", onWindowResize);
    </script>
  </body>
</html>
